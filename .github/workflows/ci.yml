name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The install action, as a workflow would use it: release binaries, checked
  # against SHA256SUMS, then both of them run.
  install-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./
        id: pion
        with:
          version: v0.1.0
          rustc-nightly: nightly-2026-06-04
      - run: cargo pion --version
      - name: Record the fixture workspace with the installed wrapper
        env:
          WRAPPER: ${{ steps.pion.outputs.pion-rustc }}
          PION_REFS_DIR: ${{ runner.temp }}/refs
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-06-04 --profile minimal
          cd tests/fixtures/workspace
          # The wrapper is set for this one command: it loads the compiler
          # library of the nightly it was built for, and cannot start under
          # any other toolchain.
          RUSTC_WORKSPACE_WRAPPER="$WRAPPER" \
            cargo +nightly-2026-06-04 check --all-targets --target-dir "$RUNNER_TEMP/fixture-target"
          test -s "$PION_REFS_DIR/fx_core.test.json"
          cargo pion plan --base HEAD --refs "$PION_REFS_DIR"
