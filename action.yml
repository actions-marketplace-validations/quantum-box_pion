name: Setup pion
description: Install pion to select the tests a change affects, from the Cargo dependency graph and compiler-recorded references.
author: Quantum Box
branding:
  icon: filter
  color: purple
inputs:
  version:
    description: >-
      Release to install, such as v0.1.2. When empty, the release this action
      was referenced by (`uses: quantum-box/pion@v0.1.2`), or the latest
      release when it was referenced by a commit or a branch.
    required: false
    default: ''
  rustc-nightly:
    description: >-
      Also install pion-rustc, the rustc wrapper that records references, built
      for this nightly (such as nightly-2026-06-04). It has to be the toolchain
      the workspace builds with. Leave empty to install cargo-pion only.
    required: false
    default: ''
outputs:
  pion-rustc:
    description: Path of pion-rustc, to set as RUSTC_WORKSPACE_WRAPPER. Empty when it was not installed.
    value: ${{ steps.install.outputs.pion-rustc }}
  version:
    description: The release that was asked for, such as v0.1.2 or latest.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        PION_RUSTC_NIGHTLY: ${{ inputs.rustc-nightly }}
        PION_INSTALL_DIR: ${{ runner.temp }}/pion/bin
      run: |
        set -euo pipefail
        PION_VERSION="$REQUESTED_VERSION"
        if [ -z "$PION_VERSION" ]; then
          # A release tag names its own binaries; anything else gets the latest.
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PION_VERSION="$ACTION_REF"
          else
            PION_VERSION=latest
          fi
        fi
        export PION_VERSION
        sh "$GITHUB_ACTION_PATH/scripts/install.sh"
        echo "$PION_INSTALL_DIR" >> "$GITHUB_PATH"
        echo "version=$PION_VERSION" >> "$GITHUB_OUTPUT"
        if [ -n "$PION_RUSTC_NIGHTLY" ]; then
          echo "pion-rustc=$PION_INSTALL_DIR/pion-rustc" >> "$GITHUB_OUTPUT"
        else
          echo "pion-rustc=" >> "$GITHUB_OUTPUT"
        fi
